<div id="douyin-qr-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="douyin-qr-title">
  <div class="modal-card modal-card-log bilibili-qr-card" onclick="event.stopPropagation()">
    <h3 id="douyin-qr-title">抖音扫码登录</h3>
    <p class="field-hint bilibili-qr-hint">用抖音 App 扫描本页二维码即可，不需要打开服务器桌面。运行服务的电脑需已安装 Google Chrome。登录成功后 Cookie 自动写入 <code>data/douyin_cookies.txt</code>，下载抖音时使用，不会覆盖 B 站 Cookie。</p>
    <div class="bilibili-qr-wrap">
      <canvas id="douyin-qr-canvas" width="240" height="240" aria-label="抖音登录二维码"></canvas>
      <img id="douyin-qr-fallback" class="bilibili-qr-fallback" alt="抖音登录二维码" hidden>
    </div>
    <p id="douyin-qr-message" class="bilibili-qr-message"></p>
    <div class="modal-actions">
      <button type="button" class="small secondary" onclick="restartDouyinQrFlow()">刷新二维码</button>
      <button type="button" class="btn-primary" onclick="closeDouyinQrModal()">关闭</button>
    </div>
  </div>
</div>
