plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.family.mediacenter'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

ext {
    javalinVersion = '6.3.0'
    okhttpVersion = '4.12.0'
    gsonVersion = '2.11.0'
    jsoupVersion = '1.18.1'
    guavaVersion = '33.2.1-jre'
    lang3Version = '3.16.0'
    jsonOrgVersion = '20250517'
}

dependencies {
    implementation "io.javalin:javalin:${javalinVersion}"
    implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
    implementation "org.jsoup:jsoup:${jsoupVersion}"
    implementation "com.google.guava:guava:${guavaVersion}"
    implementation "org.apache.commons:commons-lang3:${lang3Version}"
    implementation "org.json:json:${jsonOrgVersion}"
    implementation "cn.hutool:hutool-all:5.8.27"
    implementation "cn.wanghaomiao:JsoupXpath:2.5.1"
    implementation "com.google.zxing:core:3.5.3"
    implementation "org.slf4j:slf4j-simple:2.0.13"
}

application {
    mainClass = 'com.family.mediacenter.sidecar.Main'
}

tasks.named('shadowJar') {
    archiveBaseName.set('tvbox-spider-sidecar')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
